server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ecommerce_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Local learning defaults only. Override credentials with environment variables.
app.oauth.client-id=${OAUTH_CLIENT_ID:salesforce-client}
app.oauth.client-secret=${OAUTH_CLIENT_SECRET:dev-only-change-me}
app.oauth.token-ttl-seconds=${OAUTH_TOKEN_TTL_SECONDS:900}
app.oauth.issuer=${OAUTH_ISSUER:http://localhost:8080}
app.oauth.key-directory=${OAUTH_KEY_DIRECTORY:.keys}

# Salesforce Pub/Sub subscriber (disabled by default).
# Set SALESFORCE_PUBSUB_ENABLED=true only after configuring the values below.
salesforce.pubsub.enabled=${SALESFORCE_PUBSUB_ENABLED:false}
salesforce.pubsub.instance-url=${SALESFORCE_INSTANCE_URL:}
salesforce.pubsub.tenant-id=${SALESFORCE_TENANT_ID:}
salesforce.pubsub.access-token=${SALESFORCE_ACCESS_TOKEN:}
salesforce.pubsub.host=${SALESFORCE_PUBSUB_HOST:api.pubsub.salesforce.com}
salesforce.pubsub.port=${SALESFORCE_PUBSUB_PORT:7443}
salesforce.pubsub.topic=${SALESFORCE_PUBSUB_TOPIC:/event/Contact_Updated__e}
salesforce.pubsub.batch-size=${SALESFORCE_PUBSUB_BATCH_SIZE:5}
